# NOTE: dirs ending in / list all projects within
dirs  = [
  "~/code/",
  "~/.config/kitty/meow",
]

# Sources shown by default when switch launches (valid: open, local, remote, set, history)
# default_sources = ["open", "local", "set"]

# Column widths for the project picker display
# alias_spacing = 5   # chars reserved for the alias/shortname column
# name_spacing  = 40  # chars reserved for the project name (annotation aligns after this)

template = ["nvim", "$SHELL"]

# NOTE: on macos, typically have to define full path to fzf
fzf = "/opt/homebrew/bin/fzf"

github = ["taylorzr", "AquaTeenHungerForce"]

[keybindings]
default = "ctrl-a"
remote = "ctrl-r"
history = "ctrl-i"
open = "ctrl-t"
